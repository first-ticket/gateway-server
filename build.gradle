plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.13'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.first-ticket'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.0.2")
}

dependencies {
	// Reactive Gateway (WebFlux/Netty 기반) - MVC 버전(gateway-server-webmvc)과 혼용 불가
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
	// Eureka Client — lb://service-name 방식 라우팅 지원 (LoadBalancer 포함)
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	// Keycloak JWT 서명 검증 (Spring Security Reactive 포함)
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	// 헬스체크 및 메트릭 엔드포인트
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// Prometheus
	implementation 'io.micrometer:micrometer-registry-prometheus'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

bootJar {
	archiveFileName = 'app.jar'
}