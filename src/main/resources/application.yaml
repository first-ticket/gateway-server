# 20260507 - gateway-server 환경설정을 config-repo에 이관합니다
# 서비스 내 application.yaml (여기)에는 config server에 연결하기 위한 최소 정보만 포함시킵니다.
# 모든 실질적인 설정값은 config-repo/gateway-server를 참고해주세요

spring:
  application:
    # Eureka 등록 이름 / config-repo 파일 식별자
    # config-repo 에서 gateway-server.yml 또는 gateway-server-{profile}.yml 을 가져옴
    name: gateway-server

  profiles:
    # 운영 배포 시: SPRING_PROFILES_ACTIVE=prod → gateway-server-prod.yml 로드
    # 기본값 dev: IntelliJ에서 별도 환경변수 지정 없을 때 로컬 개발 프로파일로 기동
    active: ${SPRING_PROFILES_ACTIVE:dev}

  config:
    # Config Server 주소 - 환경변수 {CONFIG_SERVER_URI} 로 Override
    # 'optional:' 접두사가 있으면 Config Server가 꺼져 있어도 임시 변수로 활용
    # 운영 환경에서는 optional: 제거하고 fail-fast: true 로 함께 사용하는 식으로 수정 예정
    import:
      # .env 파일에서 환경변수 로드 (Working Dir = gateway-server/ 일 때)
      # IntelliJ Run Configuration → Working directory: $MODULE_WORKING_DIR$ 설정 필요
      - "optional:file:.env[.properties]"
      # URL 없이 Eureka 디스커버리로 Config Server를 탐색
      # spring.cloud.config.discovery.enabled: true 가 활성화되어야 동작
      - "optional:configserver:"

  cloud:
    # ECS Fargate 환경에서 Spring Cloud InetUtils가 잘못된 IP(169.254.172.2, ECS Metadata Endpoint)를 자기 IP로 인식하여 Eureka에 등록하는 문제 해결.
    # RFC1918 사설 IP 대역(10.x, 172.x, 192.168.x)을 우선 선택하도록 강제.
    inetutils:
      preferred-networks:
        - 10\.
        - 172\.
        - 192\.168\.

    config:
      # Config Server 연결 실패 시 앱 기동 실패 처리 (운영 권장: true).
      fail-fast: ${SPRING_CLOUD_CONFIG_FAIL_FAST:false}

      # Config Server 연결 재시도 설정 (Eureka·Config Server 기동 순서 차이 대비)
      retry:
        initial-interval: 1000  # 첫 재시도 대기 시간 (ms)
        max-attempts: 6         # 최대 재시도 횟수
        max-interval: 2000      # 재시도 간격 상한 (ms)
      # Config Server Basic Auth 인증정보
      # .env 환경변수로 주입
      username: ${CONFIG_SERVER_USERNAME}
      password: ${CONFIG_SERVER_PASSWORD}
      discovery:
        enabled: true
        service-id: config-server


eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      # EUREKA_SERVER_URL 환경변수 없으면 localhost:8761로 폴백
      defaultZone: http://${EUREKA_SERVER_URL:localhost}:8761/eureka/

logging:
  level:
    # Config Server 연결 시도 로그 확인용
    # Config 로드 전에는 config-repo 로깅 설정이 아직 적용되지 않으므로 여기서 지정
    org.springframework.cloud.config: INFO